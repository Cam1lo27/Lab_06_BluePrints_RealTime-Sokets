services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: arsw
      POSTGRES_PASSWORD: arsw
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsw -d blueprints"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
